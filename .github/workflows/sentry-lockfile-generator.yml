name: Auditvergleich Sentry gegen main

on:
  push:
    branches: ['codex/sentry-lockfile-generator']

permissions:
  contents: read

jobs:
  audit:
    name: Öffentliche Abhängigkeiten vergleichen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baseline auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c7534a07134093b8dfc076c769ceb5bd39060269
          path: baseline
          persist-credentials: false
      - name: Sentry-Paketstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2217be80885df92d1e82fdb3a53257e3ecb3c11b
          path: sentry
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Advisory-Vergleich ohne Paketänderungen ausgeben
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          function scan(cwd, production) {
            const args = ['audit', '--json', '--ignore-scripts', '--no-fund', ...(production ? ['--omit=dev'] : [])];
            const result = spawnSync('npm', args, { cwd, encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
            if (![0, 1].includes(result.status)) throw new Error('Auditabfrage fehlgeschlagen.');
            const data = JSON.parse(result.stdout);
            if (data.error || !data.vulnerabilities) throw new Error('Auditdaten unvollständig.');
            return Object.fromEntries(Object.entries(data.vulnerabilities).map(([name, v]) => [name, {
              package: name, severity: v.severity,
              advisoryUrls: [...new Set(v.via.filter(x => typeof x === 'object').map(x => x.url))].sort(),
            }]));
          }
          const report = [];
          for (const production of [false, true]) {
            const baseline = scan('baseline', production);
            const sentry = scan('sentry', production);
            const scope = production ? 'production' : 'all';
            for (const name of Object.keys(sentry).sort()) {
              const current = sentry[name], before = baseline[name];
              report.push({scope, ...current, baselineSeverity: before?.severity ?? null,
                introduced: !before || current.advisoryUrls.some(url => !before.advisoryUrls.includes(url)),
                baselineAdvisoryUrls: before?.advisoryUrls ?? []});
            }
            for (const name of Object.keys(baseline).sort()) if (!sentry[name])
              report.push({scope, ...baseline[name], absentInSentry: true});
          }
          console.log('FCB_AUDIT_COMPARISON_V1 ' + JSON.stringify(report));
          NODE
